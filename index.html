<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <meta name="description" content="OpoPoint · Radar de Policía Local de Andalucía" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>OpoPoint · Radar de Policía Local de Andalucía</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="data.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display:none; }
    @keyframes fadeSlide { from {opacity:0; transform:translate(-50%,-12px)} to {opacity:1; transform:translate(-50%,0)} }
    @keyframes pulseDot { 0%,100%{transform:scale(.9);opacity:.8} 50%{transform:scale(1.15);opacity:1} }
    @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>
  <script type="text/babel">
    const {useMemo,useState} = React;
    const DATA = window.OPOPOINT_DATA || [];
    const PROVINCIAS = ['Todas','Almería','Cádiz','Córdoba','Granada','Huelva','Jaén','Málaga','Sevilla'];
    const ESTADOS = [
      ['todos','Todos'],['abierta','Abiertas'],['convocada','Convocadas'],['proceso','En proceso'],['finalizada','Finalizadas']
    ];
    const EstadoPill = ({estado}) => {
      const map = {
        abierta:['bg-emerald-50 text-emerald-700 ring-emerald-200','🟢 Abierta'],
        convocada:['bg-blue-50 text-blue-700 ring-blue-200','🔵 Convocada'],
        proceso:['bg-violet-50 text-violet-700 ring-violet-200','🟣 En proceso'],
        finalizada:['bg-slate-100 text-slate-500 ring-slate-200','⚫ Finalizada']
      };
      const [cls,label] = map[estado] || map.convocada;
      return <span className={'inline-flex items-center rounded-full px-2.5 py-1 text-[11px] font-bold ring-1 '+cls}>{label}</span>
    };
    const RadarIcon = ({size=44}) => <div style={{width:size,height:size}} className="shrink-0 rounded-full bg-slate-950 ring-1 ring-emerald-500/30 shadow-lg grid place-items-center">
      <svg viewBox="0 0 64 64" width={size-8} height={size-8} fill="none">
        <circle cx="32" cy="32" r="25" stroke="#1e3a8a" strokeWidth="2"/>
        <circle cx="32" cy="32" r="17" stroke="#1e3a8a" strokeWidth="2"/>
        <circle cx="32" cy="32" r="9" stroke="#1e3a8a" strokeWidth="2"/>
        <path d="M32 32L32 8A24 24 0 0 1 53 20Z" fill="#34d399" fillOpacity=".35"/>
        <path d="M32 32L32 7" stroke="#34d399" strokeWidth="2"/>
        <circle cx="32" cy="32" r="3.5" fill="#34d399"/>
        <circle cx="47" cy="18" r="2" fill="#34d399"/>
      </svg>
    </div>;
    const Icon = ({children,size=16,className=''}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>;
    const SearchIcon = p => <Icon {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
    const PinIcon = p => <Icon {...p}><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Icon>;
    const UsersIcon = p => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></Icon>;
    const FileIcon = p => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></Icon>;
    const Arrow = p => <Icon {...p}><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></Icon>;
    const X = p => <Icon {...p}><path d="M18 6 6 18M6 6l12 12"/></Icon>;
    const External = p => <Icon {...p}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></Icon>;

    function diasDesde(fecha){ if(!fecha) return null; const a = new Date(fecha); const b = new Date(); return Math.max(0,Math.floor((b-a)/86400000)); }

    function OpoCard({item,onOpen}){
      const age = diasDesde(item.fechaPublicacionBoe);
      return <article className="rounded-2xl bg-white ring-1 ring-slate-200 shadow-sm hover:shadow-md transition p-4">
        <div className="flex items-start justify-between gap-2">
          <div className="flex flex-wrap gap-2"><EstadoPill estado={item.estado}/><span className="rounded-full bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200 px-2.5 py-1 text-[11px] font-bold">C1</span></div>
          <span className="text-[11px] font-semibold text-slate-400">{age === null ? '' : 'BOE hace '+age+' d.'}</span>
        </div>
        <h3 className="mt-3 text-[16px] font-extrabold text-slate-950 leading-snug">{item.puesto}</h3>
        <p className="mt-1 text-sm font-semibold text-slate-600">{item.municipio} · {item.provincia}</p>
        <div className="mt-3 flex flex-wrap gap-x-4 gap-y-2 text-[12.5px] text-slate-600">
          <span className="inline-flex items-center gap-1"><UsersIcon size={14} className="text-slate-400"/>{item.plazas} plazas</span>
          <span className="inline-flex items-center gap-1"><PinIcon size={14} className="text-slate-400"/>{item.turno}</span>
        </div>
        <div className="mt-3 rounded-xl bg-slate-50 ring-1 ring-slate-200 p-3">
          <p className="text-[12px] font-semibold text-slate-800">Plazo</p>
          <p className="mt-0.5 text-[12px] leading-snug text-slate-500">{item.fechaFin ? new Date(item.fechaFin).toLocaleDateString('es-ES') : item.plazoTexto}</p>
        </div>
        <div className="mt-3 flex items-center justify-between gap-2">
          <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700">✓ Fuente oficial verificada</span>
          <button onClick={()=>onOpen(item)} className="inline-flex items-center gap-1 rounded-xl bg-slate-950 text-white px-3 py-2 text-[12px] font-bold hover:bg-blue-950">Ver proceso <Arrow size={13}/></button>
        </div>
      </article>
    }

    function Detail({item,onClose}){
      if(!item) return null;
      return <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm p-4 flex items-end md:items-center justify-center" onClick={onClose}>
        <div className="w-full max-w-2xl max-h-[92vh] overflow-auto rounded-3xl bg-white shadow-2xl" onClick={e=>e.stopPropagation()}>
          <div className="sticky top-0 bg-white/95 backdrop-blur border-b border-slate-100 px-5 py-4 flex items-start justify-between">
            <div><div className="flex gap-2 mb-2"><EstadoPill estado={item.estado}/><span className="rounded-full bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200 px-2.5 py-1 text-[11px] font-bold">C1</span></div><h2 className="text-xl font-extrabold text-slate-950">{item.puesto}</h2><p className="text-sm text-slate-500 mt-1">{item.municipio}, {item.provincia}</p></div>
            <button onClick={onClose} className="rounded-full p-2 text-slate-400 hover:bg-slate-100"><X/></button>
          </div>
          <div className="p-5 space-y-5">
            <div className="grid grid-cols-2 gap-3"><div className="rounded-2xl bg-slate-50 p-4"><p className="text-[11px] uppercase tracking-wide text-slate-400">Plazas</p><p className="mt-1 text-2xl font-extrabold text-slate-950">{item.plazas}</p></div><div className="rounded-2xl bg-slate-50 p-4"><p className="text-[11px] uppercase tracking-wide text-slate-400">Acceso</p><p className="mt-1 text-base font-bold text-slate-950">{item.turno}</p></div></div>
            <section><h3 className="font-extrabold text-slate-950">Resumen</h3><p className="mt-2 text-sm leading-relaxed text-slate-600">{item.resumen}</p></section>
            <section><h3 className="font-extrabold text-slate-950">Plazo</h3><p className="mt-2 text-sm leading-relaxed text-slate-600">{item.plazoTexto}</p></section>
            <section><h3 className="font-extrabold text-slate-950">Fuentes</h3><div className="mt-2 grid grid-cols-1 sm:grid-cols-3 gap-2">
              {item.fuentes.boe && <a target="_blank" rel="noopener noreferrer" href={item.fuentes.boe} className="rounded-xl bg-slate-950 text-white px-3 py-2.5 text-sm font-bold text-center">BOE <External size={13} className="inline"/></a>}
              {item.fuentes.boja && <a target="_blank" rel="noopener noreferrer" href={item.fuentes.boja} className="rounded-xl bg-blue-950 text-white px-3 py-2.5 text-sm font-bold text-center">BOJA <External size={13} className="inline"/></a>}
              {item.fuentes.opobusca && <a target="_blank" rel="noopener noreferrer" href={item.fuentes.opobusca} className="rounded-xl bg-emerald-600 text-white px-3 py-2.5 text-sm font-bold text-center">OpoBusca <External size={13} className="inline"/></a>}
            </div></section>
            <div className="rounded-2xl bg-emerald-50 ring-1 ring-emerald-200 p-4"><p className="text-sm font-extrabold text-emerald-800">✓ Verificación</p><p className="mt-1 text-xs text-emerald-700">Detectada en OpoBusca y contrastada con publicación oficial del BOE. Los plazos exactos deberán completarse cuando verifiquemos el cómputo de días hábiles y festivos aplicable.</p></div>
          </div>
        </div>
      </div>
    }

    function App(){
      const [query,setQuery]=useState('');
      const [prov,setProv]=useState('Todas');
      const [estado,setEstado]=useState('todos');
      const [selected,setSelected]=useState(null);
      const filtered = useMemo(()=>DATA.filter(x=>{
        const q=query.trim().toLowerCase();
        const text=[x.municipio,x.provincia,x.organismo,x.puesto,x.categoria].join(' ').toLowerCase();
        return (!q||text.includes(q)) && (prov==='Todas'||x.provincia===prov) && (estado==='todos'||x.estado===estado);
      }).sort((a,b)=>a.provincia.localeCompare(b.provincia)||b.plazas-a.plazas),[query,prov,estado]);
      const plazas = DATA.reduce((s,x)=>s+x.plazas,0);
      return <div className="min-h-screen pb-12 font-sans">
        <header className="bg-gradient-to-b from-slate-950 via-blue-950 to-blue-950 text-white">
          <div className="max-w-5xl mx-auto px-4 md:px-6 pt-5 pb-6">
            <div className="flex items-center gap-3"><RadarIcon/><div><h1 className="text-2xl md:text-3xl font-black tracking-tight">OpoPoint</h1><p className="text-xs md:text-sm text-blue-200/80">Radar de Policía Local de Andalucía</p></div></div>
            <div className="mt-5 rounded-2xl bg-white/5 ring-1 ring-white/10 p-3 flex items-center gap-3"><span className="h-2.5 w-2.5 rounded-full bg-emerald-400" style={{animation:'pulseDot 1.8s infinite'}}/><div className="min-w-0 flex-1"><p className="text-sm font-bold">Radar activo</p><p className="text-[11px] text-blue-200/70">Modo inicial: actualización asistida · 6 procesos verificados</p></div><span className="rounded-full bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-400/20 px-2.5 py-1 text-[10px] font-bold">MVP 0.1</span></div>
            <div className="mt-3 grid grid-cols-3 gap-2"><div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-3 text-center"><p className="text-xl font-black text-emerald-400">{DATA.length}</p><p className="text-[10px] text-blue-200/70">Procesos</p></div><div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-3 text-center"><p className="text-xl font-black text-emerald-400">{plazas}</p><p className="text-[10px] text-blue-200/70">Plazas</p></div><div className="rounded-2xl bg-white/5 ring-1 ring-white/10 p-3 text-center"><p className="text-xl font-black text-emerald-400">3</p><p className="text-[10px] text-blue-200/70">Provincias con datos</p></div></div>
          </div>
        </header>
        <main className="max-w-5xl mx-auto px-4 md:px-6">
          <div className="sticky top-0 z-20 -mx-4 md:-mx-6 px-4 md:px-6 pt-3 pb-3 bg-slate-100/95 backdrop-blur">
            <div className="relative"><SearchIcon size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar municipio, provincia, puesto…" className="w-full rounded-2xl bg-white ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none pl-10 pr-10 py-3 text-sm shadow-sm"/>{query && <button className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" onClick={()=>setQuery('')}><X/></button>}</div>
            <div className="mt-2.5 flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{PROVINCIAS.map(p=><button key={p} onClick={()=>setProv(p)} className={'shrink-0 rounded-full px-3 py-1.5 text-xs font-bold ring-1 '+(prov===p?'bg-slate-950 text-white ring-slate-950':'bg-white text-slate-600 ring-slate-200')}>{p}</button>)}</div>
            <div className="mt-1.5 flex gap-1.5 overflow-x-auto no-scrollbar pb-1">{ESTADOS.map(([id,label])=><button key={id} onClick={()=>setEstado(id)} className={'shrink-0 rounded-full px-3 py-1.5 text-xs font-bold ring-1 '+(estado===id?'bg-emerald-600 text-white ring-emerald-600':'bg-white text-slate-600 ring-slate-200')}>{label}</button>)}</div>
          </div>
          <div className="mt-1 flex items-center justify-between"><p className="text-xs text-slate-500">{filtered.length} resultado{filtered.length===1?'':'s'}</p>{(query||prov!=='Todas'||estado!=='todos')&&<button onClick={()=>{setQuery('');setProv('Todas');setEstado('todos')}} className="text-xs font-bold text-emerald-700">Limpiar filtros</button>}</div>
          <div className="mt-3 grid gap-3 md:grid-cols-2">{filtered.map(x=><OpoCard key={x.id} item={x} onOpen={setSelected}/> )}</div>
          {!filtered.length && <div className="mt-4 rounded-2xl bg-white p-8 text-center ring-1 ring-slate-200"><p className="font-bold text-slate-700">Sin resultados</p><p className="text-sm text-slate-500 mt-1">Prueba con otro municipio, provincia o estado.</p></div>}
          <footer className="mt-8 pb-4 text-center text-[11px] text-slate-400">OpoPoint · versión inicial · Datos contrastados con fuentes oficiales cuando se indican.</footer>
        </main>
        <Detail item={selected} onClose={()=>setSelected(null)}/>
      </div>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
